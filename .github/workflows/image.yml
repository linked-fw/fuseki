# Publishes ghcr.io/linked-fw/fuseki:<server/IMAGE_TAG> from main only (a manual run on any other
# ref does nothing). Tags are immutable: a main merge that changes server/ without a new IMAGE_TAG
# publishes nothing. Runs never overlap: one fixed concurrency group.
name: Image

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # On the job, so a skipped run on another ref never joins (or cancels) the queue.
    concurrency:
      group: image-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Existence is read from the GitHub Packages API, not the registry: GHCR answers "denied"
      # for a package that does not exist yet as well as for an auth failure. 404 means the
      # package does not exist (first publish); any other failure stops the job, because tags
      # are never overwritten.
      - name: Tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(cat server/IMAGE_TAG)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if tags=$(gh api --paginate /orgs/linked-fw/packages/container/fuseki/versions \
                      --jq '.[].metadata.container.tags[]' 2>"$RUNNER_TEMP/err"); then
            if printf '%s\n' "$tags" | grep -qxF "$tag"; then
              echo "::notice::ghcr.io/linked-fw/fuseki:$tag exists; bump server/IMAGE_TAG to publish"
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cannot tell whether ghcr.io/linked-fw/fuseki:$tag exists: $(cat "$RUNNER_TEMP/err")"
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Version matches the image tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          version=$(mvn -B -q -f server help:evaluate -Dexpression=project.version -DforceStdout)
          test "${{ steps.tag.outputs.tag }}" = "$version" || { echo "IMAGE_TAG and the pom version differ"; exit 1; }
      - if: steps.tag.outputs.exists == 'false'
        run: mvn -B -f server verify
      - uses: docker/setup-qemu-action@v3
        if: steps.tag.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.exists == 'false'
      - name: Build (amd64) and smoke
        if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: linked-fuseki:ci
      - if: steps.tag.outputs.exists == 'false'
        run: server/scripts/smoke.sh linked-fuseki:ci
      - uses: docker/login-action@v3
        if: steps.tag.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (amd64, arm64)
        if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/linked-fw/fuseki:${{ steps.tag.outputs.tag }}
