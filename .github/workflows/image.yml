# Publishes ghcr.io/linked-fw/fuseki:<server/IMAGE_TAG> from main. Tags are immutable: a main
# merge that changes server/ without a new IMAGE_TAG publishes nothing.
name: Image

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: image-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Logged in before the check: the package is private until it is made public, and an
      # unauthenticated inspect of a private tag fails like a missing one.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: |
          tag=$(cat server/IMAGE_TAG)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if out=$(docker manifest inspect "ghcr.io/linked-fw/fuseki:$tag" 2>&1); then
            echo "::notice::ghcr.io/linked-fw/fuseki:$tag exists; bump server/IMAGE_TAG to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -qiE 'manifest unknown|not found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # Anything else (auth, network) must not be read as "absent": tags are never overwritten.
            echo "::error::cannot tell whether ghcr.io/linked-fw/fuseki:$tag exists: $out"
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Version matches the image tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          version=$(mvn -B -q -f server help:evaluate -Dexpression=project.version -DforceStdout)
          test "${{ steps.tag.outputs.tag }}" = "$version" || { echo "IMAGE_TAG and the pom version differ"; exit 1; }
      - if: steps.tag.outputs.exists == 'false'
        run: mvn -B -f server verify
      - uses: docker/setup-qemu-action@v3
        if: steps.tag.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.exists == 'false'
      - name: Build (amd64) and smoke
        if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: linked-fuseki:ci
      - if: steps.tag.outputs.exists == 'false'
        run: server/scripts/smoke.sh linked-fuseki:ci
      - name: Publish (amd64, arm64)
        if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/linked-fw/fuseki:${{ steps.tag.outputs.tag }}
